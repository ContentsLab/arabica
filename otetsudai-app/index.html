<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おてつだいポイント</title>
<style>
  :root {
    --bg: #fdf6e3;
    --card-bg: #ffffff;
    --accent: #ff9800;
    --accent-dark: #e65100;
    --text: #3e2723;
    --muted: #8d6e63;
    --border: #e0d6c9;
    --danger: #e53935;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 60px;
  }
  h1 {
    text-align: center;
    font-size: 1.6em;
    margin: 8px 0 20px;
  }
  .children-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .child-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 2px solid var(--border);
  }
  .child-card.rank-1 { border-color: gold; }
  .child-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .child-name {
    font-size: 1.3em;
    font-weight: bold;
  }
  .child-points {
    font-size: 1.5em;
    font-weight: bold;
    color: var(--accent-dark);
  }
  .chore-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chore-btn {
    flex: 1 1 auto;
    min-width: 90px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 8px;
    font-size: 1em;
    cursor: pointer;
    text-align: center;
    transition: transform 0.1s;
  }
  .chore-btn:active { transform: scale(0.95); }
  .chore-btn .pts { display: block; font-size: 0.8em; opacity: 0.9; }

  section.panel {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  details summary {
    cursor: pointer;
    font-weight: bold;
    font-size: 1.1em;
    padding: 4px 0;
  }
  .row {
    display: flex;
    gap: 8px;
    margin: 8px 0;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type=text], input[type=number] {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1em;
  }
  input[type=text] { flex: 1; min-width: 100px; }
  input[type=number] { width: 80px; }
  button.small {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent-dark);
    color: white;
    cursor: pointer;
  }
  button.danger {
    background: var(--danger);
  }
  ul.list-items {
    list-style: none;
    padding: 0;
    margin: 8px 0;
  }
  ul.list-items li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
  }
  .history-list {
    max-height: 260px;
    overflow-y: auto;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 0.95em;
  }
  .history-item .meta { color: var(--muted); font-size: 0.85em; }
  .empty-msg { color: var(--muted); text-align: center; padding: 12px; }

  .when-panel {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .when-panel input[type=date] {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1em;
  }
  .period-buttons {
    display: flex;
    gap: 6px;
  }
  .period-btn {
    padding: 8px 14px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    background: white;
    color: var(--accent-dark);
    cursor: pointer;
    font-size: 1em;
  }
  .period-btn.active {
    background: var(--accent);
    color: white;
  }

  .sync-banner {
    text-align: center;
    font-size: 0.85em;
    color: var(--muted);
    margin: -10px 0 16px;
  }
  .sync-banner.readonly {
    color: var(--danger);
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>🏠 おてつだいポイント</h1>
<p class="sync-banner" id="sync-banner"></p>

<section class="panel when-panel">
  <label for="when-date">📅 いつ</label>
  <input type="date" id="when-date">
  <div class="period-buttons" id="period-buttons">
    <button type="button" class="period-btn" data-period="朝">朝</button>
    <button type="button" class="period-btn" data-period="昼">昼</button>
    <button type="button" class="period-btn" data-period="夜">夜</button>
  </div>
</section>

<div id="children-grid" class="children-grid"></div>

<section class="panel">
  <h2 style="margin-top:0;">📋 きろく</h2>
  <div id="history-list" class="history-list"></div>
</section>

<section class="panel">
  <details>
    <summary>⚙️ せってい</summary>

    <h3>こども</h3>
    <div class="row">
      <input type="text" id="new-child-name" placeholder="なまえ">
      <button class="small" id="add-child-btn">ついか</button>
    </div>
    <ul class="list-items" id="children-list"></ul>

    <h3>おてつだいの種類</h3>
    <div class="row">
      <input type="text" id="new-chore-name" placeholder="おてつだい名">
      <input type="number" id="new-chore-points" placeholder="点数" value="10">
      <button class="small" id="add-chore-btn">ついか</button>
    </div>
    <ul class="list-items" id="chores-list"></ul>

    <h3>データ</h3>
    <div class="row">
      <button class="small danger" id="reset-points-btn">点数だけリセット</button>
      <button class="small danger" id="reset-all-btn">全部リセット</button>
    </div>
  </details>
</section>

<script>
const STORAGE_KEY = "otetsudai-app-data-v1";
const DATA_FILE_PATH = "data/state.json";

let artifactApi = null;   // resolved claude.use("artifact") namespace, or null
let syncMode = "loading"; // "synced" | "local-only" | "read-only"

function defaultData() {
  return {
    children: [
      { id: cryptoRandomId(), name: "ここね" },
      { id: cryptoRandomId(), name: "なぎ" }
    ],
    chores: [
      { id: cryptoRandomId(), name: "風呂掃除and沸かす", points: 15 },
      { id: cryptoRandomId(), name: "洗濯トリコみ", points: 10 },
      { id: cryptoRandomId(), name: "洗濯たたみ", points: 10 },
      { id: cryptoRandomId(), name: "洗濯干す", points: 10 },
      { id: cryptoRandomId(), name: "洗い物", points: 10 },
      { id: cryptoRandomId(), name: "こめたき", points: 15 },
      { id: cryptoRandomId(), name: "ゴミ捨て", points: 5 }
    ],
    entries: [] // { id, childId, choreId, points, date: "YYYY-MM-DD", period: "朝"|"昼"|"夜", loggedAt }
  };
}

const PERIOD_ORDER = { "朝": 0, "昼": 1, "夜": 2 };

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function currentPeriodGuess() {
  const h = new Date().getHours();
  if (h < 11) return "朝";
  if (h < 17) return "昼";
  return "夜";
}

let selectedPeriod = currentPeriodGuess();

function cryptoRandomId() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function normalizeData(parsed) {
  if (!parsed || !parsed.children || !parsed.chores || !parsed.entries) return null;
  parsed.entries.forEach(e => {
    if (!e.date) {
      const d = new Date(e.at || e.loggedAt || Date.now());
      e.date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    if (!e.period) e.period = "朝";
    if (!e.loggedAt) e.loggedAt = e.at || Date.now();
  });
  return parsed;
}

function loadLocalData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return defaultData();
  try {
    return normalizeData(JSON.parse(raw)) || defaultData();
  } catch (e) {
    return defaultData();
  }
}

function saveLocalData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// Fetch the shared data file this artifact publishes to (relative to the
// artifact's own served location). 404 just means nobody has logged
// anything yet, so the default seed data is used.
async function fetchSharedData() {
  try {
    const res = await fetch(DATA_FILE_PATH, { cache: "no-store" });
    if (!res.ok) return null;
    return normalizeData(await res.json());
  } catch (e) {
    return null;
  }
}

let data = defaultData();

async function initData() {
  if (window.claude && typeof window.claude.use === "function") {
    artifactApi = await window.claude.use("artifact").catch(() => null);
  }
  if (artifactApi) {
    const shared = await fetchSharedData();
    data = shared || defaultData();
    syncMode = "synced";
  } else {
    data = loadLocalData();
    syncMode = "local-only";
  }
  render();
}

// Persist the current in-memory `data` after a mutation: re-render
// immediately for a snappy UI, then write through to the shared file
// (or localStorage when the artifact capability isn't available here).
async function persist() {
  render();
  if (!artifactApi) {
    saveLocalData();
    return;
  }
  try {
    await artifactApi.publish({ [DATA_FILE_PATH]: JSON.stringify(data) });
    syncMode = "synced";
  } catch (err) {
    if (err && (err.code === "not_writer" || err.code === "not_granted")) {
      syncMode = "read-only";
    }
    // "conflict": another viewer just published first — the shell reloads
    // every open view to the winning version, nothing more to do here.
  }
  renderSyncBanner();
}

function pointsForChild(childId) {
  return data.entries
    .filter(e => e.childId === childId)
    .reduce((sum, e) => sum + e.points, 0);
}

function formatDatePeriod(dateStr, period) {
  const [y, m, d] = dateStr.split("-");
  return `${parseInt(m, 10)}/${parseInt(d, 10)} ${period}`;
}

function render() {
  renderChildrenGrid();
  renderHistory();
  renderChildrenSettingsList();
  renderChoresSettingsList();
  renderPeriodButtons();
  renderSyncBanner();
}

function renderSyncBanner() {
  const banner = document.getElementById("sync-banner");
  banner.classList.toggle("readonly", syncMode === "read-only");
  if (syncMode === "synced") {
    banner.textContent = "🔗 かぞくで共有中（このリンクを開いた人みんなに反映されます）";
  } else if (syncMode === "read-only") {
    banner.textContent = "👀 閲覧のみのリンクです（記録は保存されません）";
  } else if (syncMode === "local-only") {
    banner.textContent = "📴 この端末だけに保存されています（共有されません）";
  } else {
    banner.textContent = "";
  }
}

function renderPeriodButtons() {
  document.querySelectorAll(".period-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.period === selectedPeriod);
  });
}

function renderChildrenGrid() {
  const grid = document.getElementById("children-grid");
  grid.innerHTML = "";

  if (data.children.length === 0) {
    grid.innerHTML = `<p class="empty-msg">「せってい」から こども を ついか してね</p>`;
    return;
  }

  const withPoints = data.children.map(c => ({ ...c, points: pointsForChild(c.id) }));
  const maxPoints = Math.max(...withPoints.map(c => c.points), 0);

  withPoints.forEach(child => {
    const card = document.createElement("div");
    card.className = "child-card" + (child.points > 0 && child.points === maxPoints ? " rank-1" : "");

    const header = document.createElement("div");
    header.className = "child-header";
    header.innerHTML = `
      <span class="child-name">${escapeHtml(child.name)}</span>
      <span class="child-points">${child.points} pt</span>
    `;
    card.appendChild(header);

    const btnRow = document.createElement("div");
    btnRow.className = "chore-buttons";
    if (data.chores.length === 0) {
      btnRow.innerHTML = `<span class="empty-msg">おてつだいを ついか してね</span>`;
    } else {
      data.chores.forEach(chore => {
        const btn = document.createElement("button");
        btn.className = "chore-btn";
        btn.innerHTML = `${escapeHtml(chore.name)}<span class="pts">+${chore.points}pt</span>`;
        btn.addEventListener("click", () => logEntry(child.id, chore.id));
        btnRow.appendChild(btn);
      });
    }
    card.appendChild(btnRow);

    grid.appendChild(card);
  });
}

function logEntry(childId, choreId) {
  const chore = data.chores.find(c => c.id === choreId);
  if (!chore) return;
  const dateInput = document.getElementById("when-date");
  const date = dateInput.value || todayStr();
  data.entries.push({
    id: cryptoRandomId(),
    childId,
    choreId,
    points: chore.points,
    date,
    period: selectedPeriod,
    loggedAt: Date.now()
  });
  persist();
}

function renderHistory() {
  const list = document.getElementById("history-list");
  list.innerHTML = "";
  const recent = [...data.entries].sort((a, b) => {
    if (a.date !== b.date) return b.date < a.date ? -1 : 1;
    const pa = PERIOD_ORDER[a.period] ?? 0;
    const pb = PERIOD_ORDER[b.period] ?? 0;
    if (pa !== pb) return pb - pa;
    return (b.loggedAt || 0) - (a.loggedAt || 0);
  }).slice(0, 50);

  if (recent.length === 0) {
    list.innerHTML = `<p class="empty-msg">まだ きろく がありません</p>`;
    return;
  }

  recent.forEach(entry => {
    const child = data.children.find(c => c.id === entry.childId);
    const chore = data.chores.find(c => c.id === entry.choreId);
    const item = document.createElement("div");
    item.className = "history-item";
    item.innerHTML = `
      <span>${escapeHtml(child ? child.name : "?")} が ${escapeHtml(chore ? chore.name : "?")} (+${entry.points}pt)
        <span class="meta">${formatDatePeriod(entry.date, entry.period)}</span>
      </span>
      <button class="small danger" data-entry-id="${entry.id}">取消</button>
    `;
    item.querySelector("button").addEventListener("click", () => {
      data.entries = data.entries.filter(e => e.id !== entry.id);
      persist();
    });
    list.appendChild(item);
  });
}

function renderChildrenSettingsList() {
  const list = document.getElementById("children-list");
  list.innerHTML = "";
  data.children.forEach(child => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${escapeHtml(child.name)}</span>`;
    const btn = document.createElement("button");
    btn.className = "small danger";
    btn.textContent = "削除";
    btn.addEventListener("click", () => {
      if (!confirm(`${child.name} を削除しますか？（きろくも消えます）`)) return;
      data.children = data.children.filter(c => c.id !== child.id);
      data.entries = data.entries.filter(e => e.childId !== child.id);
      persist();
    });
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function renderChoresSettingsList() {
  const list = document.getElementById("chores-list");
  list.innerHTML = "";
  data.chores.forEach(chore => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${escapeHtml(chore.name)} (${chore.points}pt)</span>`;
    const btn = document.createElement("button");
    btn.className = "small danger";
    btn.textContent = "削除";
    btn.addEventListener("click", () => {
      if (!confirm(`${chore.name} を削除しますか？（きろくも消えます）`)) return;
      data.chores = data.chores.filter(c => c.id !== chore.id);
      data.entries = data.entries.filter(e => e.choreId !== chore.id);
      persist();
    });
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("add-child-btn").addEventListener("click", () => {
  const input = document.getElementById("new-child-name");
  const name = input.value.trim();
  if (!name) return;
  data.children.push({ id: cryptoRandomId(), name });
  input.value = "";
  persist();
});

document.getElementById("add-chore-btn").addEventListener("click", () => {
  const nameInput = document.getElementById("new-chore-name");
  const pointsInput = document.getElementById("new-chore-points");
  const name = nameInput.value.trim();
  const points = parseInt(pointsInput.value, 10);
  if (!name || isNaN(points)) return;
  data.chores.push({ id: cryptoRandomId(), name, points });
  nameInput.value = "";
  pointsInput.value = "10";
  persist();
});

document.getElementById("reset-points-btn").addEventListener("click", () => {
  if (!confirm("すべての きろく（点数）をリセットしますか？")) return;
  data.entries = [];
  persist();
});

document.getElementById("reset-all-btn").addEventListener("click", () => {
  if (!confirm("こども・おてつだい・きろく を すべてリセットしますか？")) return;
  data = defaultData();
  persist();
});

document.getElementById("when-date").value = todayStr();

document.getElementById("period-buttons").addEventListener("click", (e) => {
  const btn = e.target.closest(".period-btn");
  if (!btn) return;
  selectedPeriod = btn.dataset.period;
  renderPeriodButtons();
});

initData();
</script>

</body>
</html>
